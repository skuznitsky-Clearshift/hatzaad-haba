<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FDF6E3">

<title>הצעד הבא</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<style>
:root{
  --paper:#FDF6E3; --paper2:#F7EDD6; --surface:#FFFDF6;
  --ink:#3B2C20; --soft:#7A6455; --faint:#A08D79;
  --line:#E7D8B8; --line2:#F0E5CC;
  --green:#6FA05B; --green-d:#5A8449;
  --orange:#E08A3E; --blue:#4E82A0; --purple:#9C71B4;
  --pink:#D88585; --gold:#C99A2E; --teal:#4F9689;
  --sh:0 1px 0 rgba(59,44,32,.05), 0 8px 24px -14px rgba(59,44,32,.4);
  --sh2:0 2px 0 rgba(59,44,32,.10), 0 14px 30px -16px rgba(59,44,32,.5);
}
html{direction:rtl}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Assistant','Rubik','Segoe UI',system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select{font-family:inherit;color:inherit;font-size:inherit}
button{border:none;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;line-height:1.25;font-weight:700}
p{margin:0}

/* ---------- app frame ---------- */
#app{max-width:600px;margin:0 auto;min-height:100%;position:relative}
.scr{display:none;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
.scr.on{display:block;animation:in .26s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top{display:flex;align-items:center;gap:10px;margin-bottom:16px;min-height:44px}
.top .ttl{font-size:20px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sub{font-size:13px;color:var(--faint);font-weight:400}
.back{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--sh);font-size:20px;color:var(--soft)}
.back:active{transform:scale(.92)}
.iconb{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--sh);font-size:17px}

/* ---------- buttons ---------- */
.btn{background:var(--green);color:#fff;font-weight:700;font-size:17px;padding:14px 26px;border-radius:16px;
  box-shadow:0 3px 0 var(--green-d);transition:transform .12s,box-shadow .12s;display:inline-flex;
  align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--green-d)}
.btn.full{display:flex;width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh)}
.btn.ghost:active{transform:translateY(2px)}
.btn.orange{background:var(--orange);box-shadow:0 3px 0 #B96D2A}
.btn.sm{font-size:15px;padding:10px 18px;border-radius:13px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh)}
.card+.card{margin-top:12px}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.09em;color:var(--faint)}

/* ---------- kids shelf ---------- */
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kidc{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 12px 12px;
  box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .14s}
.kidc:active{transform:scale(.96)}
.kidc svg{width:88px;height:108px;display:block}
.kidc .nm{font-size:19px;font-weight:700;margin-top:4px}
.kidc .ag{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.kidc .tag{font-size:11.5px;margin-top:6px;padding:3px 10px;border-radius:99px;background:var(--paper2);
  color:var(--soft);font-weight:600}
.kidc .tag.due{background:#F6E2CB;color:#A65E1E}
.addk{background:transparent;border:2px dashed var(--line);border-radius:22px;min-height:190px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--faint);font-weight:700}
.addk .plus{font-size:34px;line-height:1}

/* ---------- hero recommendation ---------- */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--sh2);
  border-top:5px solid var(--orange);position:relative;overflow:hidden}
.hero .eyeb{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--orange);margin-bottom:5px}
.hero h2{font-size:22px;margin-bottom:6px}
.hero .why{font-size:15px;color:var(--soft);line-height:1.5}
.hero.empty{border-top-color:var(--green)}
.hero.empty .eyeb{color:var(--green)}

/* progress bar */
.pb{display:flex;align-items:center;gap:10px;margin-top:14px}
.pbt{flex:1;height:9px;border-radius:99px;background:var(--line2);overflow:hidden}
.pbf{height:100%;border-radius:99px;background:var(--green);transition:width .5s ease}
.pb small{font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.meta{font-size:12.5px;color:var(--faint);margin-top:9px;font-variant-numeric:tabular-nums}

/* ---------- domain rings ---------- */
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin-top:14px}
.ring{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 6px 9px;
  box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .14s}
.ring:active{transform:scale(.95)}
.ring.locked{opacity:.5;box-shadow:none;background:var(--paper2)}
.ring svg{width:52px;height:52px;display:block}
.ring .rn{font-size:12px;font-weight:700;text-align:center;line-height:1.25}
.ring .rl{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.ring .pv{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- week strip ---------- */
.week{display:flex;gap:6px;justify-content:space-between;margin-top:12px}
.wd{flex:1;text-align:center}
.wd i{display:block;height:30px;border-radius:10px;background:var(--line2);margin-bottom:4px}
.wd.hit i{background:var(--green)}
.wd.today i{box-shadow:inset 0 0 0 2px var(--orange)}
.wd span{font-size:10.5px;color:var(--faint)}

/* ---------- level map ---------- */
.lmap{display:flex;gap:8px;margin:4px 0 16px;flex-wrap:wrap}
.ln{flex:1;min-width:64px;border-radius:13px;padding:9px 8px;text-align:center;border:1px solid var(--line);
  background:var(--surface);font-size:12px;font-weight:700;color:var(--faint)}
.ln b{display:block;font-size:16px;line-height:1.2}
.ln.done{background:var(--green);border-color:var(--green);color:#fff}
.ln.now{background:var(--orange);border-color:var(--orange);color:#fff}
.ln.prev{background:#F6E2CB;border-color:#E8C79E;color:#A65E1E}

/* ---------- activity rows ---------- */
.arow{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh);
  display:block;width:100%;text-align:start;margin-bottom:10px;transition:transform .14s}
.arow:active{transform:scale(.985)}
.arow .ah{display:flex;align-items:flex-start;gap:10px}
.arow .at{font-size:16.5px;font-weight:700;flex:1;line-height:1.35}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;flex:none;margin-top:2px}
.pill.ripe{background:#DCEBD3;color:#3F6B2E}
.pill.paused{background:#F3DDD8;color:#A6503C}
.pill.go{background:#F6E2CB;color:#A65E1E}
.pill.rest{background:var(--paper2);color:var(--soft)}
.pill.prev{background:#EADCF0;color:#6B4580}

/* ---------- sheet (activity detail) ---------- */
.sect{margin-top:18px}
.sect h3{font-size:12px;letter-spacing:.09em;color:var(--faint);margin-bottom:6px}
.sect p,.sect li{font-size:15.5px;line-height:1.62;color:var(--ink)}
.sect ol{margin:0;padding-inline-start:20px}
.sect ol li{margin-bottom:6px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.fact{background:var(--paper2);border-radius:13px;padding:10px 8px;text-align:center}
.fact .fl{font-size:10.5px;color:var(--faint);font-weight:700;letter-spacing:.05em}
.fact .fv{font-size:14px;font-weight:700;margin-top:2px}
.vary{display:grid;gap:8px;margin-top:8px}
.vbox{border:1px solid var(--line);border-radius:13px;padding:11px 13px;background:var(--paper2)}
.vbox b{font-size:13px;display:block;margin-bottom:1px}
.vbox span{font-size:14.5px;color:var(--soft)}

/* rating buttons */
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.rb{border:2px solid var(--line);background:var(--surface);border-radius:15px;padding:13px 6px;font-weight:700;
  font-size:15px;transition:transform .12s}
.rb:active{transform:scale(.94)}
.rb small{display:block;font-size:11px;font-weight:400;color:var(--faint);margin-top:1px}
.rb.easy{border-color:#CFE3C4} .rb.ok{border-color:#E8C79E} .rb.hard{border-color:#E8CFC8}

/* ---------- checklist ---------- */
.chk{display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);
  border-radius:15px;padding:13px;margin-bottom:9px;width:100%;text-align:start;transition:transform .12s}
.chk:active{transform:scale(.985)}
.chk .bx{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);flex:none;display:flex;
  align-items:center;justify-content:center;font-size:16px;color:#fff;margin-top:1px}
.chk.yes .bx{background:var(--green);border-color:var(--green)}
.chk.yes{border-color:#CFE3C4}
.chk span{font-size:15.5px;line-height:1.5}

/* ---------- wizard ---------- */
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.05em;margin-bottom:5px}
.field input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);
  font-size:17px;box-shadow:var(--sh)}
.field input:focus{outline:none;border-color:var(--green)}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:13px;border-radius:14px;border:2px solid var(--line);background:var(--surface);
  font-weight:700;font-size:16px}
.seg button.on{border-color:var(--green);background:#EFF5EA}
.dob{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}
.dob input{text-align:center;font-variant-numeric:tabular-nums}

/* avatar editor */
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;box-shadow:var(--sh);flex:none}
.sw.on{border-color:var(--ink)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:9px 15px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font-size:14.5px;font-weight:600}
.chip.on{border-color:var(--green);background:#EFF5EA}
.preview{display:flex;justify-content:center;margin:6px 0 16px}
.preview svg{width:150px;height:185px}

/* ---------- misc ---------- */
.banner{background:#F6E2CB;border:1px solid #E8C79E;border-radius:16px;padding:14px 16px;margin-bottom:14px;
  display:flex;gap:12px;align-items:center}
.banner .bt{flex:1;font-size:14.5px;color:#7A4715;line-height:1.45}
.banner b{color:#6B3D11}
.note{background:var(--paper2);border-radius:14px;padding:13px 15px;font-size:14px;color:var(--soft);line-height:1.55;margin-top:16px}
.empty{text-align:center;color:var(--faint);padding:36px 20px;font-size:15px}
.jday{margin-bottom:14px}
.jday .jd{font-size:12px;font-weight:700;color:var(--faint);letter-spacing:.05em;margin-bottom:5px}
.jitem{display:flex;gap:9px;align-items:baseline;font-size:14.5px;padding:7px 0;border-bottom:1px solid var(--line2)}
.jitem .jr{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;flex:none}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);background:var(--ink);
  color:var(--paper);padding:13px 22px;border-radius:99px;font-weight:700;font-size:15px;z-index:99;
  opacity:0;transition:all .3s ease;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.cele{position:fixed;inset:0;z-index:98;display:none;align-items:center;justify-content:center;
  background:rgba(253,246,227,.94);text-align:center;padding:28px}
.cele.on{display:flex;animation:in .3s ease}
.cele .cin{max-width:340px}
.cele h2{font-size:30px;margin-bottom:10px}
.cele p{font-size:17px;color:var(--soft);margin-bottom:22px}
.stars{font-size:46px;margin-bottom:14px;letter-spacing:6px}

/* כפתור ההורים — מכוון להיות לא מושך: אפור, קטן, בלי צל.
   ילד שלא קורא לא אמור לרצות ללחוץ עליו. */
.parentbtn{font-size:14px;color:var(--faint);border:1px solid var(--line);border-radius:99px;
  padding:7px 16px;background:transparent}
.parentbtn:active{opacity:.6}

/* לשוניות בממשק ההורים */
.tabs{display:flex;gap:8px;margin:2px 0 14px}
.tab{flex:1;padding:11px 8px;border-radius:14px;font-size:15.5px;font-weight:700;
  background:var(--paper2);color:var(--soft);border:1px solid transparent}
.tab.on{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--sh)}

/* כרטיס משחק — אחיד בגודלו, עם סמל גדול וצבעוני לילד שלא קורא */
.gcard{background:var(--surface);border:3px solid var(--line);border-radius:24px;padding:14px;
  box-shadow:var(--sh2);display:flex;flex-direction:column;align-items:center;gap:6px;
  width:100%;min-height:196px;justify-content:center;transition:transform .14s}
.gcard:active{transform:scale(.96)}
.gcard .gm{width:126px;height:98px}
.gcard .gm svg{width:100%;height:100%;display:block}
.gcard b{font-size:20px}
.gcard .sub2{font-size:13px;color:var(--faint);text-align:center;line-height:1.35}
.gcard .lvl{font-size:13.5px;font-weight:700;color:var(--soft)}
.games2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}

/* ---------- root: parents or kids ---------- */
.pick2{display:grid;gap:14px;margin-top:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:26px 20px;
  box-shadow:var(--sh2);display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .14s}
.pcard:active{transform:scale(.97)}
.pcard .pi{font-size:46px;line-height:1;margin-bottom:6px}
.pcard .pi svg{width:100%;height:100%;display:block}
.card .pi svg,.card div>svg{width:100%;height:auto;display:block}
.pcard b{font-size:24px}
.pcard span{font-size:14.5px;color:var(--faint)}
.pcard.kids{background:linear-gradient(160deg,#EFF5EA,#FFFDF6);border-color:#CFE3C4}

/* ---------- game host ---------- */
#game-host{position:fixed;inset:0;z-index:90;display:none;background:var(--paper)}
#game-host.on{display:block}
#game-frame{width:100%;height:100%;border:0;display:block}
#game-exit{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);inset-inline-start:8px;z-index:91;
  width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.82);border:1px solid var(--line);
  font-size:19px;color:var(--soft);display:none;align-items:center;justify-content:center;box-shadow:var(--sh)}
#game-host.on #game-exit{display:flex}

/* ---------- game insight ---------- */
.tgl{width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .18s}
.tgl i{position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.tgl.on{background:var(--green)}
.tgl.on i{transform:translateX(-22px)}
.ins{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.advice{margin-top:12px;font-size:16px;line-height:1.6;background:var(--paper2);
  border-radius:14px;padding:12px 14px}
.datalink{margin-top:10px;font-size:14.5px;font-weight:700;color:var(--blue);
  text-decoration:underline;background:none;padding:2px 0}
.databox[hidden]{display:none}
.insrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.il{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--faint);min-width:44px}
.il.good{color:#3F6B2E} .il.mid{color:#A65E1E} .il.bad{color:#A6503C}
.ic{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:700;
  padding:4px 9px;border-radius:9px;background:var(--paper2);border:1px solid var(--line)}
.ic b{font-size:11px;font-weight:600;opacity:.65;font-variant-numeric:tabular-nums}
.ic.good{background:#DCEBD3;border-color:#CFE3C4;color:#3F6B2E}
.ic.mid{background:#F6E2CB;border-color:#E8C79E;color:#A65E1E}
.ic.bad{background:#F3DDD8;border-color:#E8CFC8;color:#A6503C}

/* ---------- parent gate ---------- */
.gate{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;
  background:rgba(59,44,32,.55);padding:22px}
.gate.on{display:flex;animation:in .2s ease}
.gbox{background:var(--surface);border-radius:22px;padding:22px;max-width:340px;width:100%;box-shadow:var(--sh2)}
.gbox h2{font-size:21px;margin-bottom:6px}
.gbox p{font-size:26px;font-weight:700;text-align:center;margin:14px 0 10px;font-variant-numeric:tabular-nums;direction:ltr}
.gbox .meta{min-height:20px;color:var(--orange)}

/* ---------- welcome / profile ---------- */
.hello{text-align:center;padding:34px 4px 10px}
.hello .mark{font-size:52px;line-height:1;margin-bottom:12px}
.hello h1{font-size:32px;margin-bottom:8px}
.hello p{font-size:16px;color:var(--soft);max-width:30em;margin:0 auto}
.code{
  font-family:'Heebo','Courier New',monospace;font-size:30px;font-weight:700;
  letter-spacing:.22em;text-align:center;direction:ltr;
  background:var(--paper2);border:2px dashed var(--line);border-radius:16px;
  padding:16px 10px;margin:10px 0;user-select:all;
}
.code.input{letter-spacing:.18em;font-size:26px;border-style:solid;background:var(--surface);width:100%;text-transform:uppercase}
.xfer{
  width:100%;min-height:96px;font-family:'Heebo',monospace;font-size:11px;direction:ltr;
  border:1px solid var(--line);border-radius:13px;padding:10px;background:var(--paper2);
  color:var(--soft);resize:vertical;word-break:break-all;
}
</style>

<body>
<script>
/* PWA — רק בגרסה המתארחת. בקובץ מקומי ובתוך Artifact אין service worker. */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>


<script>document.documentElement.setAttribute("dir","rtl");document.documentElement.lang="he";</script>
<div id="app">

  <!-- 0 · welcome / profile -->
  <div class="scr" id="s-welcome">
    <div id="wc-body"></div>
  </div>

  <!-- R · root — this IS the kids' screen: who is playing -->
  <div class="scr" id="s-root">
    <div class="hello" style="padding:18px 4px 6px"><div class="mark">🌱</div><h1>מי משחק?</h1></div>
    <div class="shelf" id="root-shelf"></div>
    <div style="text-align:center;margin-top:26px">
      <button id="b-parents" class="parentbtn">הורים ›</button>
    </div>
  </div>

</svg>`;

function unb64u(s){ s = String(s).replace(/-/g,'+').replace(/_/g,'/');
  const bin = atob(s), u = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return u; }

async function packState(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if(typeof CompressionStream === 'function'){
    try{
      const st = new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));
      return 'z' + b64u(new Uint8Array(await new Response(st).arrayBuffer()));
    }catch(e){}
  }
  return 'j' + b64u(bytes);
}
async function unpackState(s){
  const kind = String(s).charAt(0), bytes = unb64u(String(s).slice(1));
  if(kind === 'z'){
    const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(new TextDecoder().decode(await new Response(st).arrayBuffer()));
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}

/* ---------------------------------------------------------------
   5. גיל, שלב, מין
   --------------------------------------------------------------- */
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseISO(s){ const p=String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function daysAgo(iso){ return Math.max(0, Math.round((parseISO(todayISO()) - parseISO(iso)) / 86400000)); }

function ageMonths(dob){
  const b = parseISO(dob), n = parseISO(todayISO());
  let m = (n.getFullYear()-b.getFullYear())*12 + (n.getMonth()-b.getMonth());
  if(n.getDate() < b.getDate()) m--;
  return Math.max(0, m);
}
function ageDays(dob){ return Math.max(0, Math.round((parseISO(todayISO()) - parseISO(dob))/86400000)); }

function ageText(k){
  const m = ageMonths(k.dob), d = ageDays(k.dob), f = (k.g==='f');
  const ben = f ? 'בת' : 'בן';
  if(d < 21) return ben + ' ' + d + ' ימים';
  if(m < 3)  return ben + ' ' + Math.round(d/7) + ' שבועות';
  if(m < 24) return ben + ' ' + m + ' חודשים';
  const y = Math.floor(m/12), r = m%12;
  if(r === 0) return ben + ' ' + y + ' בדיוק';
  return ben + ' ' + y + ' ו‑' + r + ' חודשים';
}
function stageOf(k){
  const m = ageMonths(k.dob);
  return STAGES.find(s => m >= s.a && m < s.b) || STAGES[STAGES.length-1];
}
function domainName(dm, stId){
  const al = DOMAIN_ALIAS[dm.id];
  if(al && al[stId]) return al[stId];
  return dm.n;
}

/* החלפת מין בטקסט:  {זכר|נקבה}  ו‑{name} */
function gx(s, k){
  if(s == null) return '';
  return String(s)
    .replace(/\{name\}/g, k ? k.name : '')
    .replace(/\{([^{}|]*)\|([^{}|]*)\}/g, (_, m, f) => (k && k.g === 'f') ? f : m);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
/* קיצור על גבול מילה — לפני ה‑esc, כדי לא לחתוך ישות HTML באמצע */
function shorten(s, n){
  s = String(s);
  if(s.length <= n) return s;
  return s.slice(0, n).replace(/\s+\S*$/, '') + '…';
}
function gxe(s, k){ return esc(gx(s, k)); }

/* ---------------------------------------------------------------
   6. מנוע — ניקוד, מצב, המלצה
   --------------------------------------------------------------- */
const CREDIT = {easy:1.4, ok:1.0, hard:0.5};

function actLogs(k, actId){ return k.logs.filter(l => l.a === actId).sort((x,y)=> x.d < y.d ? 1 : -1); }

function actScore(k, actId){
  let s = k.seeds[actId] || 0;
  k.logs.forEach(l => {
    if(l.a !== actId) return;
    const d = daysAgo(l.d);
    const fresh = d <= 14 ? 1 : (d <= 30 ? 0.5 : 0.2);
    s += fresh * (CREDIT[l.r] || 1);
  });
  return s;
}

/* מצב תרגיל: go / ripe / paused / refresh */
function actState(k, act){
  const lg = actLogs(k, act.id);
  const last3 = lg.slice(0,3).map(l=>l.r);
  const last2 = lg.slice(0,2).map(l=>l.r);
  let reps = act.reps;
  if(last2.length === 2 && last2[0]==='easy' && last2[1]==='easy') reps = Math.max(2, Math.ceil(reps*0.7));
  const score = actScore(k, act.id);
  const pct = Math.min(1, score / reps);
  const paused = last3.length === 3 && last3.every(r => r === 'hard');
  const bothHard = last2.length === 2 && last2.every(r => r === 'hard');
  const stale = lg.length > 0 && daysAgo(lg[0].d) > 21;

  let state = 'go';
  if(paused) state = 'paused';
  else if(score >= reps && !bothHard) state = 'ripe';
  else if(stale && score < reps) state = 'refresh';

  const cred = CREDIT[(lg[0]||{}).r] || 1;
  const left = Math.max(0, Math.ceil((reps - score) / cred));
  return {state, score, reps, pct, left, logs:lg, last: lg[0] || null,
          hintHarder: last2.length===2 && last2.every(r=>r==='easy'),
          hintEasier: paused || (last3.length>=2 && last3.slice(0,2).every(r=>r==='hard'))};
}

function levelActs(k, lv){ return lv.acts.map(a => ({a, s: actState(k, a)})); }
function levelDone(k, lv){ return !!(k.lvl[lv.id] && k.lvl[lv.id].done); }
function levelReady(k, lv){ return levelActs(k, lv).every(x => x.s.state === 'ripe'); }
function levelPct(k, lv){
  const xs = levelActs(k, lv);
  return xs.reduce((t,x)=> t + x.s.pct, 0) / xs.length;
}

/* האם נגענו ברמה הזו אי־פעם — יומן על אחד מתרגיליה, או רשומת רמה */
function levelTouched(k, lv){
  if(k.lvl[lv.id]) return true;
  return lv.acts.some(a => (k.seeds[a.id] > 0) || k.logs.some(l => l.a === a.id));
}

/* הרמות של תחום שרלוונטיות לילד.
   הגיל קובע מה נפתח, לא מה נסגר: השלב הנוכחי תמיד נכנס, ורמה
   משלב קודם נכנסת רק אם באמת התחלנו אותה — כך ילד שנכנס לאפליקציה
   בגיל שש לא מקבל תרגילי תינוקות, וילד שחצה שלב באמצע לא מאבד
   את מה שנשאר לו פתוח. */
function domainLevels(k, dmId){
  const st = stageOf(k).id;
  return LEVELS.filter(l => l.dm === dmId && (l.st === st || (l.st < st && levelTouched(k, l))))
               .sort((a,b) => a.st - b.st || a.ix - b.ix);
}
function currentLevel(k, dmId){
  const ls = domainLevels(k, dmId);
  return ls.find(l => !levelDone(k, l)) || null;
}
function openDomains(k){
  const m = ageMonths(k.dob);
  return DOMAINS.filter(d => m >= d.from);
}
function daysSinceDomain(k, dmId){
  const ids = LEVELS.filter(l=>l.dm===dmId).flatMap(l=>l.acts.map(a=>a.id));
  const ls = k.logs.filter(l => ids.indexOf(l.a) >= 0).sort((x,y)=> x.d<y.d?1:-1);
  return ls.length ? daysAgo(ls[0].d) : 99;
}

/* המלצות היום — לכל היותר שתיים */
function recommend(k){
  const st = stageOf(k).id;
  const out = [];
  openDomains(k).forEach(d => {
    const lv = currentLevel(k, d.id);
    if(!lv) return;
    const xs = levelActs(k, lv);
    const todo = xs.filter(x => x.s.state === 'go' || x.s.state === 'refresh');
    const ready = todo.length === 0 && xs.every(x => x.s.state === 'ripe');
    let act = null;
    if(todo.length){
      todo.sort((p,q)=> q.s.pct - p.s.pct);           /* הכי קרוב לסיום קודם */
      act = todo[0].a;
    } else if(!ready){
      const p = xs.find(x => x.s.state === 'paused');
      act = p ? p.a : null;
    }
    if(!act && !ready) return;
    let pr = (lv.st < st ? 3 : 0)
           + Math.min(daysSinceDomain(k, d.id), 14) / 14 * 2
           + (1 - levelPct(k, lv));
    if(ready) pr += 2.8;   /* אתגר בשל חייב להגיע לשני המקומות הראשונים */
    if(act && k.logs.some(l => l.a === act.id && l.d === todayISO())) pr -= 5;
    out.push({d, lv, act, ready, pr, prev: lv.st < st});
  });
  out.sort((a,b) => b.pr - a.pr);
  return out;
}

function ringSVG(pct, color){
  const r = 22, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(1, pct)));
  return `<svg viewBox="0 0 52 52" aria-hidden="true">
    <circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--line2)" stroke-width="6"/>
    <circle cx="26" cy="26" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 26 26)"/>
  </svg>`;
}
function bar(pct){
  return `<div class="pbt"><div class="pbf" style="width:${Math.round(Math.max(0,Math.min(1,pct))*100)}%"></div></div>`;
}
const RATE_HE = {easy:'היה קל', ok:'בדיוק', hard:'היה קשה'};
const RATE_BG = {easy:'#DCEBD3', ok:'#F6E2CB', hard:'#F3DDD8'};
const RATE_FG = {easy:'#3F6B2E', ok:'#A65E1E', hard:'#A6503C'};
function whenText(iso){
  const d = daysAgo(iso);
  if(d === 0) return 'היום';
  if(d === 1) return 'אתמול';
  if(d < 7)  return 'לפני ' + d + ' ימים';
  if(d < 14) return 'לפני שבוע';
  if(d < 31) return 'לפני ' + Math.round(d/7) + ' שבועות';
  return 'לפני יותר מחודש';
}

let CH_BACK = 's-kids', ST_BACK = 's-kids';
function openChild(id, from){
  if(from) CH_BACK = from;
  CUR = DB.kids.find(k => k.id === id);
  renderChild();
  show('s-child');

let CH_TAB = "train";
function renderChild(){
  const k = CUR, st = stageOf(k);
  document.querySelectorAll("#s-child .tab").forEach(t => t.classList.toggle("on", t.dataset.tab === CH_TAB));
  if(CH_TAB === "games"){ $("#ch-name").textContent = k.name; $("#ch-age").textContent = ageText(k); return renderTabGames(); }
  $('#ch-name').textContent = k.name;
  $('#ch-age').textContent = ageText(k) + ' · שלב ' + st.id + ' — ' + st.t;

  const recs = recommend(k);
  const doms = openDomains(k);
  let html = '';

  /* באנר שלב קודם */
  const prevOpen = doms.map(d => currentLevel(k, d.id)).filter(l => l && l.st < st.id);
  if(prevOpen.length){
    html += `<div class="banner"><div class="bt"><b>${esc(k.name)} ${k.g==='f'?'עברה':'עבר'} לשלב ${st.id} — ${esc(st.t)}.</b>
      נשאר${prevOpen.length>1?'ו':'ה'} ${prevOpen.length} ${prevOpen.length>1?'רמות':'רמה'} מהשלב הקודם, והן מופיעות ראשונות —
      השלב החדש לא מוחק אותן.</div></div>`;
  }

  /* המלצת היום */
  if(recs.length === 0){
    html += `<div class="hero empty"><div class="eyeb">הכול פתוח</div>
      <h2>סיימתם את כל מה שיש כאן</h2>
      <p class="why">אין כרגע רמה פתוחה בתחומים של ${esc(k.name)}. התוכן של השלב הבא ייפתח עם הגיל.</p></div>`;
  } else {
    const r = recs[0];
    html += heroCard(k, r, true, 0);
    if(recs.length > 1 && recs[1].pr > 0.6) html += heroCard(k, recs[1], false, 1);
  }

  /* טבעות תחומים */
  html += `<div class="lbl" style="margin:22px 0 0">התחומים של ${esc(k.name)}</div><div class="rings">`;
  DOMAINS.forEach(d => {
    const open = ageMonths(k.dob) >= d.from;
    if(!open){
      const yrs = d.from >= 12 ? (d.from/12).toString().replace('.5','.5') : d.from;
      html += `<div class="ring locked"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="22" fill="none" stroke="var(--line)" stroke-width="6" stroke-dasharray="4 6"/></svg>
        <div class="rn">${esc(d.n)}</div><div class="rl">נפתח בגיל ${yrs}</div></div>`;
      return;
    }
    const lv = currentLevel(k, d.id);
    const all = domainLevels(k, d.id);
    const doneN = all.filter(l => levelDone(k, l)).length;
    const pct = lv ? levelPct(k, lv) : 1;
    html += `<button class="ring" data-dm="${d.id}">
      ${ringSVG(pct, d.c)}
      <div class="rn">${esc(domainName(d, st.id))}</div>
      <div class="rl">${lv ? ('רמה ' + Math.min(doneN + 1, all.length) + ' מתוך ' + all.length) : 'הכול הושלם'}</div>
    </button>`;
  });
  html += `</div>`;

  /* רצף שבועי */
  const names = ['א','ב','ג','ד','ה','ו','ש'];
  const now = parseISO(todayISO());
  let wk = '<div class="lbl" style="margin:22px 0 0">השבוע</div><div class="week">';
  for(let i = 6; i >= 0; i--){
    const dt = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    const iso = dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
    const hit = k.logs.some(l => l.d === iso);
    wk += `<div class="wd ${hit?'hit':''} ${i===0?'today':''}"><i></i><span>${names[dt.getDay()]}</span></div>`;
  }
  wk += '</div>';
  const cnt = k.logs.filter(l => daysAgo(l.d) < 7).length;
  wk += `<div class="meta">${cnt} תרגילים בשבעת הימים האחרונים</div>`;
  html += wk;

  html += `<div class="note">האפליקציה מודדת תרגול, לא ילדים. טווח הנורמה רחב מאוד, וילדים לא מתקדמים בקצב אחיד בכל התחומים.</div>`;

  $('#ch-body').innerHTML = html;
  $('#ch-body').querySelectorAll('[data-dm]').forEach(b => b.onclick = () => openDomain(b.dataset.dm));
  $('#ch-body').querySelectorAll('[data-rec]').forEach(b => b.onclick = () => {
    const r = recs[+b.dataset.rec];
    CURDM = DOMAINS.find(d => d.id === r.d.id); CURLV = r.lv;
    if(r.ready) openCheck(); else openAct(r.act);
  });
}

function heroCard(k, r, big, idx){
  const st = stageOf(k).id;
  if(r.ready){
    return `<button data-rec="${idx}" class="hero" style="width:100%;text-align:start;display:block;margin-top:${big?0:12}px;border-top-color:${r.d.c}">
      <div class="eyeb" style="color:${r.d.c}">אתגר מחכה · ${esc(domainName(r.d, st))}</div>
      <h2>${esc(gx(r.lv.ck.t, k))}</h2>
      <p class="why">כל התרגילים של הרמה בשלים. חמש שאלות תצפית, ואפשר לעלות רמה.</p>
      <div class="meta">רמה ${r.lv.ix} · ${esc(r.lv.t)}</div>
    </button>`;
  }
  const s = actState(k, r.act);
  return `<button data-rec="${idx}" class="hero" style="width:100%;text-align:start;display:block;margin-top:${big?0:12}px;border-top-color:${r.d.c}">
    <div class="eyeb" style="color:${r.d.c}">${big?'הצעד של היום':'ואם יש עוד זמן'} · ${esc(domainName(r.d, st))}${r.prev?' · מהשלב הקודם':''}</div>
    <h2>${gxe(r.act.t, k)}</h2>
    <p class="why">${esc(shorten(gx(r.act.why, k), big ? 9999 : 150))}</p>
    <div class="pb">${bar(s.pct)}<small>${Math.round(s.score*10)/10} מתוך ${s.reps}</small></div>

function openDomain(dmId){
  CURDM = DOMAINS.find(d => d.id === dmId);
  CURLV = currentLevel(CUR, dmId);
  renderDomain();
  show('s-domain');
}

function renderDomain(){
  const k = CUR, d = CURDM, st = stageOf(k).id;
  const all = domainLevels(k, d.id);
  $('#dm-name').textContent = domainName(d, st);
  $('#dm-sub').textContent = k.name;

  let html = '<div class="lmap">';
  all.forEach(l => {
    const done = levelDone(k, l);
    const now = CURLV && CURLV.id === l.id;
    const cls = done ? 'done' : (now ? (l.st < st ? 'prev' : 'now') : '');
    html += `<div class="ln ${cls}"><b>${l.ix}</b>${esc(l.t)}${l.st < st ? '<div style="font-size:10px;opacity:.85">שלב '+l.st+'</div>' : ''}</div>`;
  });
  html += '</div>';

  if(!CURLV){
    html += `<div class="empty">כל הרמות שיש כאן הושלמו. הרמות הבאות ייפתחו כש${k.name} ${k.g==='f'?'תגדל':'יגדל'} לשלב הבא.</div>`;
    $('#dm-body').innerHTML = html;
    return;
  }

  const lv = CURLV;
  if(lv.st < st){
    html += `<div class="banner"><div class="bt">הרמה הזו נשארה פתוחה <b>מהשלב הקודם</b>. היא התנאי לרמות של השלב הנוכחי, ולכן היא ראשונה בתור.</div></div>`;
  }
  html += `<div class="lbl">רמה ${lv.ix} · ${esc(lv.t)}</div>`;

  const xs = levelActs(k, lv);
  xs.forEach(x => {
    const s = x.s;
    const pillCls = s.state==='ripe'?'ripe':s.state==='paused'?'paused':s.state==='refresh'?'rest':'go';
    const pillTxt = s.state==='ripe'?'בשל':s.state==='paused'?'בהפסקה':s.state==='refresh'?'לרענן':'ממשיכים';
    html += `<button class="arow" data-act="${x.a.id}">
      <div class="ah"><div class="at">${gxe(x.a.t, k)}</div><div class="pill ${pillCls}">${pillTxt}</div></div>
      <div class="pb">${bar(s.pct)}<small>${Math.round(s.score*10)/10} / ${s.reps}</small></div>
      <div class="meta">${esc(x.a.dur)} · ${x.a.pace} בשבוע${s.last?' · '+esc(whenText(s.last.d)):''}</div>
    </button>`;
  });

  const ready = xs.every(x => x.s.state === 'ripe');
  const fails = (k.lvl[lv.id] && k.lvl[lv.id].fails) || null;
  const retry = k.lvl[lv.id] && k.lvl[lv.id].retry;
  html += `<div class="card" style="margin-top:16px;border-color:${ready?d.c:'var(--line)'}">
    <div class="lbl">אתגר הרמה</div>
    <h3 style="margin:4px 0 6px;font-size:18px">${esc(gx(lv.ck.t, k))}</h3>
    <p style="font-size:15px;color:var(--soft)">${ready
      ? 'כל התרגילים בשלים. חמישה דברים שאתם רואים בעיניים — וזהו.'
      : 'ייפתח כשכל התרגילים ברמה יגיעו ל"בשל".'}</p>
    ${retry ? `<div class="meta">ניסיון חוזר מומלץ החל מ‑${esc(retry)}</div>` : ''}
    ${fails && fails.length ? `<div class="meta">בפעם הקודמת לא עברו: ${fails.map(i=>esc(gx(lv.ck.items[i],k))).join(' · ')}</div>` : ''}
    <div class="btnrow"><button class="btn ${ready?'':'ghost'} sm" id="b-check" ${ready?'':'disabled'}>לגשת לאתגר</button></div>
  </div>`;

  $('#dm-body').innerHTML = html;
  $('#dm-body').querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    openAct(lv.acts.find(a => a.id === b.dataset.act));
  });
  const bc = $('#b-check'); if(bc) bc.onclick = openCheck;
}

function renderAct(){

      <div class="rate">
        <button class="rb" data-seed="0">לא<small>מתחילים מאפס</small></button>
        <button class="rb ok" data-seed="0.3">קצת<small>כמה פעמים</small></button>
        <button class="rb easy" data-seed="0.7">הרבה<small>זה כבר שגרה</small></button>
      </div></div>`;
  }

  html += `<div class="sect"><h3>למה זה חשוב</h3><p>${gxe(a.why, k)}</p></div>
    <div class="sect"><h3>איך עושים</h3><ol>${a.how.map(h => '<li>' + gxe(h, k) + '</li>').join('')}</ol></div>
    <div class="facts">
      <div class="fact"><div class="fl">ציוד</div><div class="fv" style="font-size:12.5px">${gxe(a.gear, k)}</div></div>
      <div class="fact"><div class="fl">כמה זמן</div><div class="fv">${esc(a.dur)}</div></div>
      <div class="fact"><div class="fl">קצב</div><div class="fv">${a.pace} בשבוע</div></div>
    </div>
    <div class="sect"><h3>איך נראית הצלחה</h3><p>${gxe(a.ok, k)}</p></div>
    <div class="sect"><h3>טעות נפוצה</h3><p>${gxe(a.trap, k)}</p></div>
    <div class="sect"><h3>אם צריך לשנות</h3><div class="vary">
      <div class="vbox"><b>קל יותר</b><span>${gxe(a.easy, k)}</span></div>
      <div class="vbox"><b>קשה יותר</b><span>${gxe(a.hard, k)}</span></div>
    </div></div>`;

  html += `<div class="card" style="margin-top:20px"><div class="lbl">עשינו עכשיו — איך היה?</div>
    <div class="rate">
      <button class="rb easy" data-r="easy">היה קל<small>אפשר להקשות</small></button>
      <button class="rb ok" data-r="ok">בדיוק<small>הרמה נכונה</small></button>
      <button class="rb hard" data-r="hard">היה קשה<small>נרד רמה</small></button>
    </div></div>`;

  if(s.logs.length){
    html += `<div class="sect"><h3>הפעמים האחרונות</h3>`;
    s.logs.slice(0,6).forEach(l => {
      html += `<div class="jitem"><span class="jr" style="background:${RATE_BG[l.r]};color:${RATE_FG[l.r]}">${RATE_HE[l.r]}</span><span>${esc(whenText(l.d))}</span></div>`;
    });
    html += `</div>`;
  }

  const b = $('#ac-body');
  b.innerHTML = html;
  b.querySelectorAll('[data-seed]').forEach(x => x.onclick = () => {

    save(); renderAct();
    toast(parseFloat(x.dataset.seed) ? 'נרשם. המונה מתחיל מהמקום הנכון.' : 'מתחילים מאפס.');
  });
  b.querySelectorAll('[data-r]').forEach(x => x.onclick = () => logAct(x.dataset.r));

function logAct(rating){
  const k = CUR, a = CURACT;
  const before = actState(k, a).state;
  k.logs.push({a:a.id, d:todayISO(), r:rating});
  save();
  const s = actState(k, a);

  if(before !== 'ripe' && s.state === 'ripe'){
    if(levelReady(k, CURLV)) celebrate('הרמה מוכנה לאתגר!', 'כל התרגילים ברמה בשלים. אפשר לגשת לאתגר של ' + CURLV.t + '.', '🏅');
    else celebrate('התרגיל בשל!', 'עוד תרגיל שסיימתם. נשאר להשלים את השאר ברמה.', '⭐️⭐️⭐️');
  } else if(s.state === 'paused'){
    toast('שלוש פעמים היה קשה — עוצרים. עברו לגרסה הקלה.');
  } else if(rating === 'easy' && s.hintHarder){
    toast('היה קל פעמיים — קיצרנו את היעד. נסו את הגרסה הקשה.');
  } else {
    toast(s.state === 'ripe' ? 'נרשם. התרגיל בשל.' : 'נרשם. עוד ' + s.left + (s.left === 1 ? ' פעם.' : ' פעמים.'));
  }
  renderAct();
}

let CK = [];
function openCheck(){
  CK = CURLV.ck.items.map(() => false);
  renderCheck();
  show('s-check');
}
function renderCheck(){
  const k = CUR, lv = CURLV;
  let html = `<div class="card"><div class="lbl">${esc(CURDM ? domainName(CURDM, stageOf(k).id) : '')} · רמה ${lv.ix}</div>
    <h3 style="margin:4px 0 6px;font-size:20px">${esc(gx(lv.ck.t, k))}</h3>
    <p style="font-size:15px;color:var(--soft)">סמנו רק מה שראיתם בעיניים בשבועיים האחרונים. ארבעה מתוך חמישה — ${k.g==='f'?'היא עולה':'הוא עולה'} רמה.</p></div>
    <div style="margin-top:14px">`;
  lv.ck.items.forEach((it, i) => {
    html += `<button class="chk ${CK[i]?'yes':''}" data-i="${i}"><div class="bx">${CK[i]?'✓':''}</div><span>${gxe(it, k)}</span></button>`;
  });
  const n = CK.filter(Boolean).length, need = Math.ceil(lv.ck.items.length * 0.8);
  html += `</div><div class="card" style="margin-top:6px">
    <div class="meta">סומנו ${n} מתוך ${lv.ck.items.length} · צריך ${need} כדי לעבור</div>
    <div class="btnrow"><button class="btn full" id="b-ck-done">לסיים את האתגר</button></div>
  </div>`;
  $('#ck-body').innerHTML = html;
  $('#ck-body').querySelectorAll('[data-i]').forEach(b => b.onclick = () => { CK[+b.dataset.i] = !CK[+b.dataset.i]; renderCheck(); });
  $('#b-ck-done').onclick = finishCheck;
}
function finishCheck(){
  const k = CUR, lv = CURLV;
  const n = CK.filter(Boolean).length, need = Math.ceil(lv.ck.items.length * 0.8);
  const fails = CK.map((v,i)=> v?-1:i).filter(i => i >= 0);
  if(n >= need){
    k.lvl[lv.id] = {done:1, ts:todayISO()};
    save();
    const nxt = currentLevel(k, lv.dm);
    celebrate(k.name + ' ' + (k.g==='f'?'עלתה':'עלה') + ' רמה!',
      nxt ? 'הרמה הבאה נפתחה: ' + nxt.t + '.' : 'זו הייתה הרמה האחרונה שיש כאן כרגע.', '🎉');
    CURLV = nxt;
    renderDomain(); show('s-domain'); renderChild();
  } else {
    /* מחזירים לרמה את התרגילים שמאמנים את מה שנפל */
    const retry = new Date(); retry.setDate(retry.getDate() + 14);
    const rIso = retry.getDate() + '.' + (retry.getMonth()+1);
    k.lvl[lv.id] = {done:0, fails:fails, retry:rIso};
    /* מורידים 40% מהניקוד של התרגילים ברמה, כדי שיחזרו למסך */
    lv.acts.forEach(a => { k.seeds[a.id] = Math.max(0, actScore(k, a.id) * 0.6 - k.logs.filter(l=>l.a===a.id).length * 0); });
    lv.acts.forEach(a => { k.logs = k.logs.filter(l => !(l.a === a.id && daysAgo(l.d) > 30)); });
    save();
    toast('עוד לא. סימנו מה חסר וקבענו ניסיון חוזר בעוד שבועיים.');
    renderDomain(); show('s-domain');
  }
}

document.querySelectorAll("#s-child .tab").forEach(t => t.onclick = () => { CH_TAB = t.dataset.tab; renderChild(); });

function actById(id){
  for(const l of LEVELS){ const a = l.acts.find(x => x.id === id); if(a) return {a, l}; }
  return null;
}
function renderJournal(){
  const k = CUR;
  const byDay = {};
  k.logs.slice().sort((a,b)=> a.d < b.d ? 1 : -1).forEach(l => { (byDay[l.d] = byDay[l.d] || []).push(l); });
  const days = Object.keys(byDay).sort().reverse().slice(0, 30);
  if(!days.length){ $('#jr-body').innerHTML = '<div class="empty">עוד לא נרשם כלום. כל "עשינו" יופיע כאן.</div>'; return; }

  /* סיכום שבועי */
  const w = k.logs.filter(l => daysAgo(l.d) < 7);
  const byDm = {};
  w.forEach(l => { const f = actById(l.a); if(f) byDm[f.l.dm] = (byDm[f.l.dm]||0)+1; });
  const top = Object.keys(byDm).sort((a,b)=>byDm[b]-byDm[a]);
  let html = `<div class="card"><div class="lbl">השבוע האחרון</div>
    <h3 style="margin:4px 0 6px;font-size:19px">${w.length} תרגילים${top.length? ', הכי הרבה ב'+esc(DOMAINS.find(d=>d.id===top[0]).n) : ''}</h3>
    <p style="font-size:15px;color:var(--soft)">${
      openDomains(k).filter(d => daysSinceDomain(k, d.id) > 10).length
      ? 'לא נגעתם השבוע ב: ' + esc(openDomains(k).filter(d => daysSinceDomain(k, d.id) > 10).map(d=>d.n).join(' · '))
      : 'נגעתם בכל התחומים הפתוחים לאחרונה.'}</p></div>`;

  days.forEach(d => {
    html += `<div class="jday"><div class="jd">${esc(whenText(d))} · ${d.split('-').reverse().join('.')}</div>`;
    byDay[d].forEach(l => {
      const f = actById(l.a);
      html += `<div class="jitem"><span class="jr" style="background:${RATE_BG[l.r]};color:${RATE_FG[l.r]}">${RATE_HE[l.r]}</span><span>${f ? gxe(f.a.t, k) : esc(l.a)}</span></div>`;
    });
    html += `</div>`;
  });
  $('#jr-body').innerHTML = html;
}

    b.querySelectorAll('[data-shirt]').forEach(x => x.onclick = () => set('shirt', x.dataset.shirt));
    b.querySelectorAll('[data-print]').forEach(x => x.onclick = () => set('print', x.dataset.print));
    b.querySelector('[data-bow]').onclick = () => set('bow', !W.av.bow);
    $('#w-back').onclick = () => { W.step = 1; renderWizard(); };
    $('#w-save').onclick = saveWizard;
  }
}
function wizISO(){
  const d = parseInt(W.dd,10), m = parseInt(W.mm,10), y = parseInt(W.yy,10);
  if(!(d>=1&&d<=31&&m>=1&&m<=12&&y>=1990&&y<=2100)) return null;
  const iso = y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  const t = parseISO(iso);
  if(t.getDate() !== d || t.getMonth() !== m-1) return null;
  if(t > parseISO(todayISO())) return null;
  return iso;
}
function saveWizard(){
  const iso = wizISO(); if(!iso) return toast('תאריך לידה לא תקין');
  if(W.edit){
    const k = DB.kids.find(x => x.id === W.edit);
    k.name = W.name; k.g = W.g; k.dob = iso; k.av = W.av;
  } else {
    DB.kids.push({id:'k'+Date.now(), name:W.name, g:W.g, dob:iso, av:W.av, logs:[], seeds:{}, lvl:{}});
  }
  save(); renderShelf(); show('s-kids');
  toast(W.edit ? 'נשמר' : W.name + ' ' + (W.g==='f'?'נוספה':'נוסף'));
}

/* ---------------------------------------------------------------
   14.4 סנכרון בענן — כבוי כברירת מחדל
   ---------------------------------------------------------------
   כל עוד לא הוזנה כתובת שרת, שום בקשה לא יוצאת מהמכשיר.
   קוד השרת נמצא ב‑next-step-src\sync-worker.js.
   --------------------------------------------------------------- */
const SYNCKEY = 'nextstep.sync';
function syncCfg(){
  try{ return JSON.parse(localStorage.getItem(SYNCKEY) || 'null') || {url:'', secret:''}; }
  catch(e){ return {url:'', secret:''}; }
}
function syncSave(c){ try{ localStorage.setItem(SYNCKEY, JSON.stringify(c)); }catch(e){} }
function syncOn(){ const c = syncCfg(); return !!(c.url && /^https:\/\//.test(c.url)); }

async function cloudPush(){
  const c = syncCfg();
  if(!syncOn()) return toast('לא הוגדרה כתובת שרת');
  try{
    const r = await fetch(c.url.replace(/\/+$/,'') + '/p/' + UID, {
      method:'PUT',
      headers:{'Content-Type':'application/json', 'X-Secret': c.secret || ''},
      body: JSON.stringify(DB)
    });
    const j = await r.json().catch(()=>({}));
    if(!r.ok || !j.ok) return toast('העלאה נכשלה: ' + (j.error || r.status));
    toast('הועלה לענן · ' + UID);
  }catch(e){ toast('אין חיבור לשרת'); }
}
/* משיכה גולמית לפי קוד — מחזיר state או null, בלי לגעת במסך */
async function cloudFetch(code){
  const c = syncCfg();
  if(!syncOn()) return null;
  const r = await fetch(c.url.replace(/\/+$/,'') + '/p/' + cleanCode(code));
  if(!r.ok) return null;
  const j = await r.json().catch(()=>null);
  if(!j || !j.ok || !j.data || !Array.isArray(j.data.kids)) return null;
  return j.data;
}
async function cloudPull(){
  if(!syncOn()) return toast('לא הוגדרה כתובת שרת');
  let state;
  try{ state = await cloudFetch(UID); }
  catch(e){ return toast('אין חיבור לשרת'); }
  if(!state) return toast('אין עדיין נתונים בענן לקוד ' + UID);
  const n = state.kids.length;
  if(!confirm('הורדת ' + n + ' ילדים מהענן תחליף את מה שיש במכשיר הזה. להמשיך?')) return;
  DB = state; save(); renderShelf(); show('s-kids');
  toast('הורדו ' + n + ' ילדים מהענן');
}

/* ---------------------------------------------------------------
   14.5 שמירת קובץ
   ---------------------------------------------------------------
   קישור <a download> פשוט אינו עובד כשהדף רץ בתוך צופה Artifact —
   שם שמירה עוברת דרך יכולת downloads שהצופה מאשר. תומכים בשתי הדרכים.
   --------------------------------------------------------------- */
let _dl;
async function getDownloads(){
  if(_dl !== undefined) return _dl;
  _dl = null;
  try{ if(window.claude && typeof claude.use === 'function') _dl = await claude.use('downloads'); }catch(e){}
  return _dl;
}
async function exportFile(){
  const name = 'hatzaad-haba-' + UID + '-' + todayISO() + '.json';
  const text = JSON.stringify(DB, null, 2);
  const dl = await getDownloads();
  if(dl){
    try{ await dl.save({filename:name, data:text}); toast('הקובץ נשמר'); }
    catch(err){
      const c = (err && err.code) || 'unavailable';
      if(c === 'declined')          toast('בוטל — לא נשמר כלום');
      else if(c === 'too_large')    toast('הקובץ גדול מדי לשמירה');
      else if(c === 'rate_limited') toast('רגע — יש כבר בקשת שמירה פתוחה');
      else                          toast('שמירה לקובץ לא זמינה כאן. השתמשו בלינק ההעברה.');
    }
    return;
  }
  try{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], {type:'application/json'}));
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('הקובץ ירד');
  }catch(e){ toast('שמירה לקובץ לא זמינה כאן. השתמשו בלינק ההעברה.'); }
}

/* משחק זמין לילד: החלטה מפורשת של ההורה גוברת על סף הגיל.
   בלי החלטה — הגיל קובע. */
function gameEnabled(k, g){
  const ov = (k.gamesOn || {})[g.id];
  if(ov === true || ov === false) return ov;
  return ageMonths(k.dob) >= g.from;
}
function setGameEnabled(k, id, val){
  if(!k.gamesOn) k.gamesOn = {};
  const g = GAMES.find(x => x.id === id);
  const auto = g ? ageMonths(k.dob) >= g.from : false;
  if(val === auto) delete k.gamesOn[id];      /* חזרה לברירת המחדל */
  else k.gamesOn[id] = val;
  save();
}
function gamesFor(k){ return GAMES.filter(g => gameEnabled(k, g)); }
function gameState(k, id){ return (k.games || {})[id] || null; }
function setGameState(k, id, st){
  if(!k.games) k.games = {};
  k.games[id] = st;
  save();
}

/* ---------------------------------------------------------------
   המלצה מילולית מנתוני המשחק
   ---------------------------------------------------------------
   ההורה לא אמור לקרוא טבלה כדי להבין מה לעשות. זו פסקה אחת
   שאומרת על מה לעבוד, ורק מתחתיה הנתונים הגולמיים.
   --------------------------------------------------------------- */
function weakestSkills(st){
  const sk = (st && st.stats && st.stats.skills) || {};
  return Object.keys(sk)
    .map(k => ({k, v:sk[k], n:(sk[k].ok||0)+(sk[k].miss||0)}))
    .filter(r => r.n >= MIN_SEEN)
    .sort((a,b) => itemScore(a.v) - itemScore(b.v));
}
/* פריטים חלשים, מפוצלים לפי המיומנות שבה נמדדו */
function weakBySkill(st){
  const items = (st && st.stats && st.stats.bySkill) || null;
  const flat  = (st && st.stats && st.stats.items) || {};
  const out = {};
  if(items){
    Object.keys(items).forEach(sk => {
      out[sk] = Object.keys(items[sk])
        .map(k => ({k, v:items[sk][k], n:(items[sk][k].ok||0)+(items[sk][k].miss||0)}))
        .filter(r => r.n >= MIN_SEEN && itemScore(r.v) < .6)
        .sort((a,b) => itemScore(a.v) - itemScore(b.v)).map(r => r.k);
    });
    return out;
  }
  /* אין פילוח לפי מיומנות — נופלים לרשימה אחת */
  out['_'] = Object.keys(flat)
    .map(k => ({k, v:flat[k], n:(flat[k].ok||0)+(flat[k].miss||0)}))
    .filter(r => r.n >= MIN_SEEN && itemScore(r.v) < .6)
    .sort((a,b) => itemScore(a.v) - itemScore(b.v)).map(r => r.k);
  return out;
}
const listHe = a => a.length <= 1 ? (a[0]||'') : a.slice(0,-1).join(', ') + ' ו' + a[a.length-1];

function gameAdvice(g, st){
  if(!st || !st.stats) return 'עוד לא שיחקתם, אז אין לי על מה להמליץ.';
  const skills = weakestSkills(st);
  const by     = weakBySkill(st);
  const all    = by['_'] || [];
  const bits   = [];

  /* אילו פריטים חלשים, ובאילו מיומנויות */
  const keys = Object.keys(by).filter(s => s !== '_' && by[s].length);
  if(keys.length >= 2){
    const a = by[keys[0]], b = by[keys[1]];
    const both = a.filter(x => b.indexOf(x) >= 0);
    const onlyB = b.filter(x => a.indexOf(x) < 0);
    if(both.length) bits.push('הייתי ממליץ לעבוד יחד על ' + listHe(both) + ' — גם ב' + keys[0] + ' וגם ב' + keys[1]);
    if(onlyB.length) bits.push(listHe(onlyB) + ' רק ב' + keys[1]);
  } else if(all.length){
    bits.push('הייתי ממליץ לעבוד יחד על ' + listHe(all.slice(0,6)));
  }

  /* על איזו מיומנות ללחוץ יותר */
  if(skills.length){
    const worst = skills[0], best = skills[skills.length-1];
    let s = 'ובכללי הייתי עובד יותר חזק על ' + worst.k;
    if(skills.length > 1 && itemScore(skills[1].v) < .8) s += ' וטיפה על ' + skills[1].k;
    bits.push(s);
    if(itemScore(best.v) >= .85 && best.k !== worst.k) bits.push(best.k + ' כבר במקום טוב');
  }
  if(!bits.length) return 'הנתונים עוד דלילים. עוד כמה סיבובים ואוכל להמליץ.';
  return bits.join(', ') + '.';
}

/* ---------------------------------------------------------------
   מה הנתונים מהמשחק אומרים
   ---------------------------------------------------------------
   כל משחק שולח stats.items — לכל פריט (מספר, אות, עצם) כמה פעמים
   נענה נכון וכמה לא. מכאן נגזר במה הילד חזק ובמה מתקשה.
   סף: לפחות 3 מפגשים עם פריט לפני שמחווים עליו דעה.
   --------------------------------------------------------------- */
const MIN_SEEN = 3;
function itemScore(v){ const n = (v.ok||0) + (v.miss||0); return n ? (v.ok||0)/n : 0; }

function gameInsight(g, st){
  const items = st && st.stats && st.stats.items;
  if(!items) return '';
  const rows = Object.keys(items)
    .map(k => ({k, v:items[k], n:(items[k].ok||0)+(items[k].miss||0)}))
    .filter(r => r.n >= MIN_SEEN);
  if(rows.length < 3) return '';

  rows.forEach(r => r.s = itemScore(r.v));
  const strong = rows.filter(r => r.s >= 0.8).sort((a,b)=>b.s-a.s);
  const weak   = rows.filter(r => r.s <  0.5).sort((a,b)=>a.s-b.s);
  const mid    = rows.filter(r => r.s >= 0.5 && r.s < 0.8);
  const total  = rows.reduce((t,r)=>t+r.n, 0);

  const chip = (r, cls) => `<span class="ic ${cls}">${esc(g.fmt ? g.fmt(r.k) : r.k)}<b>${Math.round(r.s*100)}%</b></span>`;
  let h = `<div class="ins">`;
  h += `<div class="meta">${total} תשובות · ${rows.length} פריטים נמדדו</div>`;
  if(strong.length) h += `<div class="insrow"><span class="il good">חזק</span>${strong.slice(0,8).map(r=>chip(r,'good')).join('')}</div>`;
  if(mid.length)    h += `<div class="insrow"><span class="il mid">באמצע</span>${mid.slice(0,8).map(r=>chip(r,'mid')).join('')}</div>`;
  if(weak.length)   h += `<div class="insrow"><span class="il bad">מתקשה</span>${weak.slice(0,8).map(r=>chip(r,'bad')).join('')}</div>`;

  /* סוגי תרגיל — "רמת התרגילים שהוא פותר" */
  const sk = st.stats.skills || {};
  const skRows = Object.keys(sk).map(k => ({k, v:sk[k], n:(sk[k].ok||0)+(sk[k].miss||0)})).filter(r => r.n >= MIN_SEEN);
  if(skRows.length){
    h += `<div class="insrow"><span class="il">סוגי תרגיל</span>` +
      skRows.sort((a,b) => itemScore(b.v) - itemScore(a.v))
        .map(r => `<span class="ic ${itemScore(r.v)>=0.8?'good':itemScore(r.v)>=0.5?'mid':'bad'}">${esc(r.k)}<b>${Math.round(itemScore(r.v)*100)}%</b></span>`)
        .join('') + `</div>`;
  }

  const lv = st.stats.levels || {};
  const lvRows = Object.keys(lv).map(k=>({k, v:lv[k], n:(lv[k].ok||0)+(lv[k].miss||0)})).filter(r=>r.n>=MIN_SEEN);
  if(lvRows.length){
    h += `<div class="insrow"><span class="il">רמות</span>` +
         lvRows.sort((a,b)=>a.k-b.k).map(r=>`<span class="ic ${itemScore(r.v)>=0.8?'good':itemScore(r.v)>=0.5?'mid':'bad'}">רמה ${r.k}<b>${Math.round(itemScore(r.v)*100)}%</b></span>`).join('') + `</div>`;
  }
  if(weak.length) h += `<div class="meta" style="margin-top:8px">כדאי לתרגל בבית דווקא את אלה שמסומנים "מתקשה".</div>`;
  h += `</div>`;
  return h;
}

/* --- מסך השורש: זה מסך הילדים. אין יותר פיצול הורים/ילדים בכניסה,
       כי משתמשים פשוט לא מצאו את המשחקים. --- */
function renderRoot(){
  const el = $('#root-shelf');
  el.innerHTML = DB.kids.map(k => `<button class="kidc" data-pk="${k.id}">
      ${avatarSVG(Object.assign({alt:k.name}, k.av))}
      <div class="nm">${esc(k.name)}</div>
      <div class="tag">${gamesFor(k).length ? gamesFor(k).length + ' משחקים' : 'עוד קטן למשחקים'}</div>
    </button>`).join('') +
    `<button class="addk" id="b-addkid"><span class="plus">+</span><span>ילד חדש</span></button>`;

  el.querySelectorAll('[data-pk]').forEach(b => b.onclick = () => {
    CUR = DB.kids.find(k => k.id === b.dataset.pk);
    renderPlayGame(); show('s-play-game');
  });
  /* הוספת ילד היא פעולה של הורה — מאחורי השער */
  $('#b-addkid').onclick = () => askParent(() => startWizard());
}
$('#b-parents').onclick  = () => askParent(() => { CUR = CUR || DB.kids[0]; if(CUR){ openChild(CUR.id, 's-root'); } else { renderShelf(); show('s-kids'); } });
$('#b-parents2').onclick = () => askParent(() => openChild(CUR.id, 's-play-game'));

function renderPlayGame(){
  const k = CUR;
  $('#pg-name').textContent = k.name;
  const gs = gamesFor(k);
  if(!gs.length){
    $('#pg-body').innerHTML = `<div class="empty">אין עדיין משחקים ל${esc(k.name)}.<br>הם נפתחים עם הגיל, ואפשר להדליק אותם בממשק ההורים.</div>`;
    return;
  }
  /* כרטיסים בגודל אחיד, סמל גדול וצבעוני — ילד שלא קורא מזהה לפי הסמל */
  $('#pg-body').innerHTML = `<div class="games2">` + gs.map(g => {
    const st = gameState(k, g.id);
    const lvl = st && st.level ? 'רמה ' + st.level : '';
    const stars = st && st.stars ? ' ⭐ ' + st.stars : '';
    return `<button class="gcard" data-pg="${g.id}" style="border-color:${g.bg}">
      <div class="gm">${GMARK[g.id] || ''}</div>
      <b>${esc(g.n)}</b>
      <div class="lvl">${lvl}${stars}</div>
    </button>`;
  }).join('') + `</div>`;
  $('#pg-body').querySelectorAll('[data-pg]').forEach(b => b.onclick = () => openGame(b.dataset.pg));
}

/* --- אירוח המשחק --- */
let CURGAME = null;
function openGame(id){
  const g = GAMES.find(x => x.id === id); if(!g) return;
  CURGAME = g;
  const fr = $('#game-frame');
  fr.src = g.file;
  $('#game-host').classList.add('on');
}
function closeGame(){
  $('#game-host').classList.remove('on');
  $('#game-frame').src = 'about:blank';
  CURGAME = null;
  renderPlayGame(); show('s-play-game');
}
$('#game-exit').onclick = closeGame;

/* הפרוטוקול מול המשחק */
window.addEventListener('message', ev => {
  const d = ev.data;
  if(!d || typeof d !== 'object' || !CURGAME || !CUR) return;
  const fr = $('#game-frame');
  if(d.type === 'ns-ready'){
    fr.contentWindow.postMessage({
      type:'ns-init',
      child:{id:CUR.id, name:CUR.name, g:CUR.g},
      state: gameState(CUR, CURGAME.id)
    }, '*');
  } else if(d.type === 'ns-save' && d.state){
    setGameState(CUR, CURGAME.id, d.state);
  } else if(d.type === 'ns-exit'){
    closeGame();
  }
});

/* שער ההורים. שתי טעויות סוגרות אותו וחוזרות אחורה — ההנחה היא
   שילד לחץ בטעות, ומבוגר שטעה פשוט ילחץ שוב. */
let GATE_OK = null, GATE_TRIES = 0;
function askParent(then){
  GATE_OK = then; GATE_TRIES = 0;
  const a = 10 + Math.floor(Math.random()*80), b = 10 + Math.floor(Math.random()*80);
  $('#gq').textContent = a + ' + ' + b + ' = ?';
  $('#gq').dataset.ans = String(a + b);
  $('#ga').value = ''; $('#gerr').textContent = '';
  $('#gate').classList.add('on');
  setTimeout(() => $('#ga').focus(), 60);
}
function closeGate(){ $('#gate').classList.remove('on'); GATE_OK = null; GATE_TRIES = 0; }
function gateSubmit(){
  if($('#ga').value.trim() === $('#gq').dataset.ans){
    const f = GATE_OK; closeGate(); if(f) f();
    return;
  }
  GATE_TRIES++;
  if(GATE_TRIES >= 2){
    $('#gerr').textContent = 'טעית פעמיים, אני חוזר אחורה';
    setTimeout(closeGate, 1500);
    return;
  }
  $('#gerr').textContent = 'לא נכון, נסו שוב';
  $('#ga').value = '';
}
$('#gok').onclick = gateSubmit;
$('#ga').addEventListener('keydown', e => { if(e.key === 'Enter') gateSubmit(); });
$('#gcancel').onclick = closeGate;

/* ---------------------------------------------------------------
   16. ניווט והפעלה
   --------------------------------------------------------------- */
document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => {
  let t = b.dataset.back;
  if(t === 'auto') t = CH_BACK;
  if(t === 'autost') t = ST_BACK;
  if(t === 's-play-game'){ renderPlayGame(); return show('s-play-game'); }
  /* יציאה מאזור הילדים חזרה למסך השורש עוברת דרך שער ההורים */
  if(t === 's-root'){ renderRoot(); return show('s-root'); }
  if(t === 's-kids'){ renderShelf(); }
  if(t === 's-child'){ renderChild(); }
  if(t === 's-play-kid'){ renderRoot(); return show('s-root'); }
  if(t === 's-domain'){ if(CURDM) renderDomain(); else { renderChild(); return show('s-child'); } }
  show(t);
});

/* ---------------------------------------------------------------
   17. מסך 0 — פרופיל: חדש, קיים, או לינק העברה
   --------------------------------------------------------------- */
function renderWelcome(mode){
  const b = $('#wc-body');

  if(mode === 'paste'){
    b.innerHTML = `
      <div class="hello"><div class="mark">📥</div><h1>קוד העברה</h1>
        <p>הדביקו כאן את הקוד הארוך — או את הלינק המלא — שיצרתם במכשיר שבו הילדים כבר קיימים.</p></div>
      <div class="card" style="margin-top:18px">
        <textarea class="xfer" id="wc-paste" rows="5" placeholder="הדביקו כאן"></textarea>
        <div id="wc-err"></div>
        <div class="btnrow"><button class="btn full" id="wc-load">טעינה</button>
          <button class="btn ghost full" id="wc-back2">חזרה</button></div>
      </div>
      <div class="note">את הקוד הארוך מייצרים בהגדרות, תחת "העברה למכשיר אחר". צריך אותו רק כשאין סנכרון בענן.</div>`;
    $('#wc-load').onclick = () => importTransfer($('#wc-paste').value);
    $('#wc-back2').onclick = () => renderWelcome();
    return;
  }

  const others = knownProfiles();
  b.innerHTML = `
    <div class="hello"><div class="mark">🌱</div><h1>הצעד הבא</h1>
      <p>לכל ילד, דבר אחד לעשות היום — לפי הגיל שלו, לפי הרמה שלו, ולפי מה שכבר עשיתם.</p></div>
    <div class="card" style="margin-top:22px">
      <label style="display:block;font-size:12.5px;font-weight:700;color:var(--faint);letter-spacing:.05em;margin-bottom:5px">הקוד שלך</label>
      <input class="code input" id="wc-code" inputmode="latin" maxlength="6" placeholder="XXXXXX" autocomplete="off" autocapitalize="characters">
      <div id="wc-err"></div>
      <div class="btnrow"><button class="btn full" id="wc-go">כניסה</button>
        <button class="btn ghost full" id="wc-new">אין לי קוד — צרו לי אחד</button></div>
    </div>
    ${others.length ? `<div class="lbl" style="margin-top:24px">פרופילים במכשיר הזה</div>
      <div class="btnrow">${others.map(u=>`<button class="btn ghost sm" data-sw="${u}">${u}</button>`).join('')}</div>` : ''}
    <div style="text-align:center;margin-top:22px">
      <button id="wc-paste-b" style="font-size:14px;color:var(--soft);text-decoration:underline">יש לי קוד העברה ארוך</button></div>
    <div class="note">${syncOn()
      ? 'הקוד מביא איתו את הילדים וההתקדמות מכל מכשיר.'
      : 'הכול נשמר בדפדפן הזה בלבד. אין חשבון ואין הרשמה.'}</div>`;

  $('#wc-go').onclick = () => enterCode($('#wc-code').value);
  $('#wc-code').addEventListener('keydown', e => { if(e.key === 'Enter') enterCode($('#wc-code').value); });
  $('#wc-new').onclick = () => { let c; do{ c = newCode(); } while(profileExists(c)); boot(c, true); };
  $('#wc-paste-b').onclick = () => renderWelcome('paste');
  b.querySelectorAll('[data-sw]').forEach(x => x.onclick = () => boot(x.dataset.sw));
}

/* שדה אחד לכולם: אם יש סנכרון — מנסים למשוך מהשרת; אם אין מה למשוך,
   או שאין סנכרון בכלל — נפתח פרופיל עם הקוד הזה. אותה חוויה בשני המקרים. */
async function enterCode(raw){
  const c = cleanCode(raw);
  const err = m => {
    const box = $('#wc-err');
    if(box) box.innerHTML = '<div class="note" style="border-color:var(--orange);color:var(--ink);margin-top:10px">' + esc(m) + '</div>';
  };
  if(c.length !== 6) return err('הקוד הוא שש אותיות וספרות.');

  if(syncOn()){
    const btn = $('#wc-go'); if(btn){ btn.textContent = 'רגע…'; btn.disabled = true; }
    let state = null;
    try{ state = await cloudFetch(c); }catch(e){}
    if(btn){ btn.textContent = 'כניסה'; btn.disabled = false; }
    if(state && Array.isArray(state.kids)){
      UID = c; DB = state; save(); setHash(c);
      renderShelf(); show('s-kids');
      return toast('נטענו ' + state.kids.length + ' ילדים');
    }
  }
  boot(c, !profileExists(c));
}

/* מקבל קוד העברה גולמי, או לינק מלא שמכיל אותו */
/* מקבל קוד העברה גולמי, או לינק מלא שמכיל אותו */
async function importTransfer(raw){
  const err = m => {
    const box = $('#wc-err');
    if(box){ box.innerHTML = '<div class="note" style="border-color:var(--orange);color:var(--ink)">' + esc(m) + '</div>'; }
    toast(m);
  };
  let s = String(raw || '').trim();
  if(!s) return err('לא הודבק כלום.');

  const m = s.match(/[#&]d=([^&\s]+)/);
  let uid = null;
  if(m){
    const mu = s.match(/[#&]u=([A-Za-z0-9]{4,12})/);
    if(mu) uid = cleanCode(mu[1]);
    s = m[1];
  }
  s = s.replace(/\s+/g, '');
  if(s.length < 8) return err('הקוד קצר מדי — כנראה לא הועתק כולו.');

  let problem;
  try{ problem = await consumeTransfer({u: uid, d: s}); }
  catch(e){ return err('משהו נכשל בטעינה: ' + (e && e.message ? e.message : 'שגיאה לא ידועה')); }
  if(problem) return err(problem);
}

function boot(uid, isNew){
  DB = load(uid);
  if(!DB) DB = emptyDB();
  UID = uid;
  save();
  renderShelf(); renderRoot();
  show(DB.kids.length ? 's-root' : 's-new');
  if(!DB.kids.length) startWizard();
  setHash(uid);                       /* אחרי הציור, ואף פעם לא לפניו */
  if(isNew) setTimeout(() => toast('הקוד שלך: ' + uid + ' — שמור אותו'), 600);
}

/* לינק העברה בכתובת */
/* מחזיר null בהצלחה, או מחרוזת שמסבירה מה נכשל */
async function consumeTransfer(p){
  let state;
  try{ state = await unpackState(p.d); }
  catch(e){ return 'הקוד לא נפתח. ודאו שהעתקתם אותו במלואו, בלי רווחים ובלי שורות חסרות.'; }
  if(!state || !Array.isArray(state.kids)) return 'הקוד נפתח אבל לא נמצאו בו ילדים.';

  const uid = cleanCode(p.u) || cleanCode(state.uid) || newCode();
  delete state.uid;
  const n = state.kids.length;
  if(profileExists(uid) && !confirm('כבר יש נתונים בפרופיל ' + uid + ' במכשיר הזה. הקוד יחליף אותם ב‑' + n + ' ילדים. להמשיך?'))
    return 'בוטל. לא שונה כלום.';

  /* שומרים ומציירים לפני כל נגיעה בכתובת — הכתובת היא קישוט,
     והנתונים הם העיקר. */
  UID = uid;
  DB = state;
  save();
  renderShelf();
  show('s-kids');
  setHash(uid);
  toast('הועברו ' + n + ' ילדים לפרופיל ' + uid);
  return null;
}

(async function start(){
  const p = hashParams();
  if(p.d){ let bad; try{ bad = await consumeTransfer(p); }catch(e){ bad = 1; } if(!bad) return; }

  let uid = cleanCode(p.u);
  if(uid.length === 6){ boot(uid, !profileExists(uid)); return; }   /* קוד מהכתובת — קיים או חדש */
  try{ uid = cleanCode(localStorage.getItem(LASTKEY)); }catch(e){}
  if(uid.length === 6 && profileExists(uid)){ boot(uid); return; }

  /* הרצה ראשונה על הקובץ המקומי בלבד: מאמצים נתונים מגרסה קודמת, ואם
     אין — נטענים ארבעת הילדים. בגרסת ה‑Artifact אין את הדגל הזה, ולכן
     מי שנכנס מהלינק מתחיל ריק ומקבל קוד משלו. */
  if(window.NS_LOCAL && !knownProfiles().length){
    let legacy = null;
    try{ const raw = localStorage.getItem(KEYBASE); if(raw) legacy = JSON.parse(raw); }catch(e){}
    let c; do{ c = newCode(); } while(profileExists(c));
    UID = c;
    DB = (legacy && legacy.kids && legacy.kids.length) ? legacy : seedKids();
    save(); setHash(c);
    renderShelf(); renderRoot(); show('s-root');
    setTimeout(()=> toast('הקוד שלך: ' + c + ' — נמצא גם בהגדרות'), 700);
    return;
  }

  renderWelcome();
  show('s-welcome');
})();
</script>
